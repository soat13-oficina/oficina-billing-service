name: Infra (Billing)

# Terraform de infra/ deste servico: RDS oficina-billing-db-<env>, fila billing-commands + DLQ,
# ECR, Role IRSA (SQS da Saga) e o segredo oficina/<env>/mercadopago (vazio; preenchido a mao).
#
#   PR / push que mexe em infra/  -> fmt + validate (sem AWS)
#   workflow_dispatch             -> plan | apply | destroy no ambiente escolhido
#
# Apply e destroy sao SEMPRE manuais: nada daqui roda sozinho na AWS.
#
# Ordem (PLANO-FASE-4.md, secao 9.2):
#   apply:   oficina-infra-k8s -> oficina-infra-database -> infra/ do OS Service -> este infra/
#            -> infra/ da Execution -> deploy dos servicos -> oficina-lambda-auth
#   destroy: a ordem inversa
#
# Configuracao no repositorio:
#   Secrets:   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   Variables: TF_STATE_BUCKET (a MESMA bucket das outras camadas), AWS_REGION (opcional)

on:
  pull_request:
    paths: ['infra/**', '.github/workflows/infra.yml']
  push:
    branches: [master, homologacao, desenvolvimento]
    paths: ['infra/**', '.github/workflows/infra.yml']
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente (workspace do Terraform)
        type: choice
        required: true
        default: hml
        options: [hml, prd]
      action:
        description: Acao do Terraform
        type: choice
        required: true
        default: plan
        options: [plan, apply, destroy]

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VERSION: latest
  TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}

jobs:
  validacao-terraform:
    name: Validacao do Terraform (fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        run: |
          terraform init -backend=false
          terraform validate -no-color

  terraform:
    name: terraform ${{ inputs.action }} (${{ inputs.environment }})
    needs: validacao-terraform
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Regras de protecao do Environment "producao" valem para apply e destroy em prd.
    environment: ${{ inputs.environment == 'prd' && 'producao' || 'homologacao' }}
    concurrency:
      group: oficina-billing-infra-${{ inputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=$AWS_REGION"

      - name: Seleciona o workspace ${{ inputs.environment }}
        run: terraform workspace select -or-create "${{ inputs.environment }}"

      - name: terraform ${{ inputs.action }}
        timeout-minutes: 20
        run: |
          case "${{ inputs.action }}" in
            plan)    terraform plan -no-color -input=false ;;
            apply)   terraform apply -auto-approve -no-color -input=false && terraform output -no-color ;;
            destroy) terraform destroy -auto-approve -no-color -input=false ;;
          esac
