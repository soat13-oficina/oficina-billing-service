apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-billing-service
spec:
  replicas: 2
  template:
    metadata:
      labels:
        tags.datadoghq.com/env: "prd"
    spec:
      containers:
        - name: oficina-billing-service
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
