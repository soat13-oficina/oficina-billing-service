# ServiceAccount do pod, associada por IRSA a uma IAM Role propria do servico
# (oficina-<env>-oficina-billing-service): fila billing-commands, envio para os-saga-replies e
# segredo do Mercado Pago. A Role nasce no infra/ deste repositorio (Passo 3); o ARN real entra
# pelo patch-serviceaccount.yaml de cada overlay, preenchido pela pipeline.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oficina-billing-service
  labels:
    app: oficina-billing-service
