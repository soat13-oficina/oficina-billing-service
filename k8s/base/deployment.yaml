# Namespace, imagem, replicas e recursos vem do overlay do ambiente.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-billing-service
  labels:
    app: oficina-billing-service
spec:
  selector:
    matchLabels:
      app: oficina-billing-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: oficina-billing-service
        app.kubernetes.io/name: oficina-billing-service
        app.kubernetes.io/part-of: oficina
        # Unified service tagging da Datadog (env e version vem do overlay e da pipeline).
        tags.datadoghq.com/service: oficina-billing-service
      annotations:
        #
        #   oficina.pagamento.{criados,aprovados,recusados,expirados,estornados}.count  funil de cobranca
        #   oficina.pagamento.webhook.rejeitados.count   webhook do Mercado Pago recusado (assinatura/segredo)
        #   oficina.mensageria.* / oficina.outbox.*      mensageria da Saga (publicadas, falhas, DLQ, outbox parado)
        # Autodiscovery do Datadog Agent: raspa /actuator/prometheus DO POD, na porta 8081 (%%host%% e o IP do
        # pod; nao passa pelo Service). Mesma lista fechada e mesmo mapeamento do OS Service (ver o comentario em
        # oficina-app/k8s/base/deployment.yaml): o counter perde o _total, o namespace "oficina" e prependado e
        # o nome final sai como oficina.<nome>.count (counter) ou oficina.<nome> (gauge). Metrica raspada e custom
        # metric cobrada por serie: so entra o que tem alerta ou widget.
        ad.datadoghq.com/oficina-billing-service.checks: |
          {
            "openmetrics": {
              "init_config": {},
              "instances": [
                {
                  "openmetrics_endpoint": "http://%%host%%:8081/actuator/prometheus",
                  "namespace": "oficina",
                  "metrics": [
                    {"oficina_mensageria_publicadas": "mensageria.publicadas"},
                    {"oficina_mensageria_consumidas": "mensageria.consumidas"},
                    {"oficina_mensageria_falhas": "mensageria.falhas"},
                    {"oficina_mensageria_sqs_recebidas": "mensageria.sqs.recebidas"},
                    {"oficina_mensageria_dlq_mensagens": "mensageria.dlq.mensagens"},
                    {"oficina_outbox_pendentes": "outbox.pendentes"},
                    {"oficina_outbox_esgotadas": "outbox.esgotadas"},
                    {"oficina_outbox_idade_maxima_seconds": "outbox.idade.maxima"},
                    {"oficina_pagamento_criados": "pagamento.criados"},
                    {"oficina_pagamento_aprovados": "pagamento.aprovados"},
                    {"oficina_pagamento_recusados": "pagamento.recusados"},
                    {"oficina_pagamento_expirados": "pagamento.expirados"},
                    {"oficina_pagamento_estornados": "pagamento.estornados"},
                    {"oficina_pagamento_estornos_falhas": "pagamento.estornos.falhas"},
                    {"oficina_pagamento_webhook_rejeitados": "pagamento.webhook.rejeitados"}
                  ]
                }
              ]
            }
          }
    spec:
      serviceAccountName: oficina-billing-service
      containers:
        - name: oficina-billing-service
          # Nome simbolico: o overlay troca por <ECR>/oficina-billing-service:<tag> (bloco images:).
          image: oficina-billing-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            # Actuator (health + prometheus): fora do Service e do Ingress; probes e o Datadog
            # Agent falam direto com o IP do pod.
            - name: management
              containerPort: 8081
          envFrom:
            # ConfigMap gerado pelo overlay (configMapGenerator) com sufixo de hash: mudanca de
            # configuracao dispara rolling update.
            - configMapRef:
                name: oficina-billing-service-config
          env:
            - name: MANAGEMENT_SERVER_PORT
              value: "8081"
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_SERVICE
              value: "oficina-billing-service"
            - name: DD_LOGS_INJECTION
              value: "true"
            # Log JSON (Elastic Common Schema, nativo do Spring Boot 4), como no OS Service.
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: "ecs"
            # Secrets criados pela pipeline a partir do Secrets Manager (ci-cd.yml, job deploy):
            #   JWT_SECRET      oficina/<env>/jwt-secret (o mesmo do OS e da Lambda)
            #   SERVICE_TOKEN   oficina/<env>/service-token (consulta de precos no OS)
            #   MERCADOPAGO_*   oficina/<env>/mercadopago (vazios com o gateway simulado em hml)
            #   DB_USER/DB_PASS usuario master do RDS oficina-billing-db-<env>
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oficina-billing-service-secrets
                  key: JWT_SECRET
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: oficina-billing-service-secrets
                  key: SERVICE_TOKEN
            - name: MERCADOPAGO_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: oficina-billing-service-secrets
                  key: MERCADOPAGO_ACCESS_TOKEN
                  optional: true
            - name: MERCADOPAGO_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: oficina-billing-service-secrets
                  key: MERCADOPAGO_WEBHOOK_SECRET
                  optional: true
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: oficina-billing-db-credentials
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: oficina-billing-db-credentials
                  key: DB_PASS
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
